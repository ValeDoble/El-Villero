  --bg: #0a2018;
  --panel: #123528;
  --panel2: #1a4433;
  --line: #2c5540;
  --chalk: #ffffff;
  --muted: #b9d4c5;
  --grass: #57d38c;
  --grass-dim: #1f4a34;
  --gold: #e8c23a;
  --danger: #ff5b42;
  --danger-dim: #5a2c22;
}
*{box-sizing:border-box;}
.brand-logo{
  background-image: var(--logo-url);
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}
.brand-logo.lg{ width:150px; height:110px; margin:0 auto 10px; }
.brand-logo.sm{ width:44px; height:32px; }
.brand-logo.corner{
  width: 46px;
  height: 34px;
  opacity: .9;
  margin: 0 0 8px auto;
}

body{
  margin:0;
  background: var(--bg);
  color: var(--chalk);
  font-family: 'Baloo 2', sans-serif;
  font-weight:600;
  min-height:100vh;
}
#app{
  max-width:640px;
  margin:0 auto;
  padding:24px 18px 60px;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color: var(--muted);
}
h1.logo{
  font-family:'Anton', sans-serif;
  font-weight:700;
  font-size:52px;
  letter-spacing:.02em;
  text-transform:uppercase;
  margin:4px 0 2px;
  color: var(--chalk);
}
h1.logo span{ color: var(--grass); }
.subtitle{
  color: var(--muted);
  font-size:15px;
  margin:0 0 28px;
}
.card{
  background: var(--panel);
  border:1px solid var(--line);
  border-radius:10px;
  padding:22px;
  margin-bottom:16px;
}
label{
  display:block;
  font-family:'IBM Plex Mono', monospace;
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color: var(--muted);
  margin-bottom:6px;
}
input[type=text]{
  width:100%;
  background: var(--panel2);
  border:1px solid var(--line);
  border-radius:6px;
  color: var(--chalk);
  font-family:'Baloo 2', sans-serif;
  font-size:16px;
  padding:10px 12px;
  margin-bottom:18px;
}
input[type=text]:focus{ outline:2px solid var(--grass); border-color:transparent; }
.style-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-bottom:18px;
}
.style-opt{
  background: var(--panel2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:14px 16px;
  cursor:pointer;
  text-align:left;
}
.style-opt:hover{ border-color: var(--grass); }
.style-opt.sel{ border-color: var(--grass); background: var(--grass-dim); }
.style-opt .t{
  font-family:'Anton', sans-serif;
  font-weight:700;
  text-transform:uppercase;
  font-size:21px;
  letter-spacing:.02em;
  color:#ffffff;
  text-shadow: 0 2px 0 rgba(0,0,0,.55), 0 0 1px rgba(0,0,0,.8);
  -webkit-text-stroke: 0.4px rgba(0,0,0,.35);
}
.style-opt .d{ color: var(--muted); font-size:13.5px; margin-top:5px; font-weight:600; }
button.primary{
  width:100%;
  background: var(--grass);
  color: #10160e;
  border:none;
  border-radius:8px;
  font-family:'Anton', sans-serif;
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:16px;
  padding:14px;
  cursor:pointer;
}
button.primary:hover{ filter:brightness(1.08); }
button.primary:disabled{ opacity:.4; cursor:not-allowed; }

#game{ display:none; }
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:14px;
}
.age-badge{
  font-family:'Anton', sans-serif;
  font-weight:700;
  font-size:22px;

function randomClub(minTier, maxTier, divisions){
  const divs = divisions || ['PD','PN'];
  const pool = CLUBS.filter(c => c.t >= (minTier==null?1:minTier) && c.t <= (maxTier==null?5:maxTier) && divs.includes(c.d));
  return pool[Math.floor(Math.random()*pool.length)];
}

// --- Salarios ---
// Argentina: solo Boca/River/Racing pueden superar los u$s200.000 anuales.
// San Lorenzo/Independiente/Estudiantes/Vélez: hasta u$s120.000. El resto: tope u$s100.000,
// sin importar nivel ni edad. Un pibe joven y de bajo nivel cobra apenas 10-12k.
const CLUBES_ELITE_ARG = ['River Plate', 'Boca Juniors', 'Racing'];
const CLUBES_GRANDES_ARG = ['San Lorenzo', 'Independiente', 'Estudiantes (LP)', 'Vélez Sarsfield'];

function computeSalaryArgentina(club, futbol, age){
  let techo, piso;
  if(CLUBES_ELITE_ARG.includes(club.n)){ techo = 420000; piso = 15000; }
  else if(CLUBES_GRANDES_ARG.includes(club.n)){ techo = 120000; piso = 9000; }
  else { techo = 100000; piso = 6000; }

  const nivelFactor = Math.pow(Math.max(0, futbol) / 100, 1.6);
  let edadFactor;
  if(age <= 19) edadFactor = 0.35;
  else if(age <= 24) edadFactor = 0.65;
  else if(age <= 32) edadFactor = 1.0;
  else edadFactor = 0.7;
  const randF = 0.9 + Math.random() * 0.2;

  let salario = piso + (techo - piso) * nivelFactor * edadFactor * randF;
  salario = Math.max(piso * 0.6, Math.min(techo, salario));
  return Math.round(salario / 500) * 500;
}

function computeSalaryEuropa(club, futbol, age){
  // Piso u$s150.000. El techo real (hasta u$s5.000.000) solo se acerca con nivel 90+.
  let techoNivel;
  if(futbol >= 90) techoNivel = 5000000;
  else if(futbol >= 82) techoNivel = 2200000;
  else if(futbol >= 68) techoNivel = 800000;
  else techoNivel = 320000;

  const clubFactor = club.t === 0 ? 1.3 : (club.t === 0.5 ? 1.0 : 0.7);
  const techo = techoNivel * clubFactor;
  const piso = 150000;

  const nivelFactor = Math.min(1, Math.pow(Math.max(0, futbol - 55) / 45, 1.3));
  let edadFactor;
  if(age <= 19) edadFactor = 0.5;
  else if(age <= 24) edadFactor = 0.75;
  else if(age <= 32) edadFactor = 1.0;
  else edadFactor = 0.75;
  const randF = 0.9 + Math.random() * 0.25;

  let salario = piso + (techo - piso) * nivelFactor * edadFactor * randF;
  salario = Math.max(piso * 0.9, Math.min(techo, salario));
  return Math.round(salario / 1000) * 1000;
}

function computeSalaryMexico(club, futbol, age){
  const techo = 1800000, piso = 80000;
  const nivelFactor = Math.pow(Math.max(0, futbol) / 100, 1.4);
  let edadFactor;
  if(age <= 19) edadFactor = 0.4;
  else if(age <= 24) edadFactor = 0.7;
  else if(age <= 32) edadFactor = 1.0;
  else edadFactor = 0.7;
  const randF = 0.9 + Math.random() * 0.2;
  let salario = piso + (techo - piso) * nivelFactor * edadFactor * randF;
  salario = Math.max(piso * 0.7, Math.min(techo, salario));
  return Math.round(salario / 500) * 500;
}

function computeSalary(club, futbol, age){
  if(club.d === 'EU') return computeSalaryEuropa(club, futbol, age);
  if(club.d === 'MX') return computeSalaryMexico(club, futbol, age);
  if(club.d === 'POL' || club.d === 'LIBRE') return 0;
  return computeSalaryArgentina(club, futbol, age);
}

function fmtUSD(n){
  return 'u$s ' + Math.round(n).toLocaleString('es-AR');
}

function crestInitials(name){
  const clean = name.replace(/\(.*?\)/g,'').trim();
  const words = clean.split(/\s+/).filter(Boolean);
  if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
  return clean.substring(0,2).toUpperCase();
}
function crestColor(name){
  let h=0;
  for(let i=0;i<name.length;i++){ h = name.charCodeAt(i) + ((h<<5)-h); }
  const hue = Math.abs(h)%360;
  return `hsl(${hue}, 58%, 36%)`;
}
function crestHTML(name, extraStyle){
  return `<div class="crest" style="background:${crestColor(name)};${extraStyle||''}">${crestInitials(name)}</div>`;
}

function applyEffects(eff){
  if(!eff) return;
  Object.keys(eff).forEach(k=>{
    if(k==='guita'){
      state.stats.guita = Math.max(0, state.stats.guita + eff.guita);
      // Toda plata que mueve el stat "Guita" también pega en la plata real de carrera.
      state.carreraGanancias += Math.round(eff.guita * 1400);
    }
    else if(state.stats[k]!==undefined){ state.stats[k] = clamp(state.stats[k] + eff[k]); }
  });
}

// Para gastos grandes y puntuales (deudas, préstamos, coimas) que deben pegar de verdad
// en la cuenta bancaria real, no solo en el stat abstracto de Guita.
function pagarPorcentajeGanancias(pct){
  const monto = Math.round(Math.max(0, state.carreraGanancias) * pct);
  state.carreraGanancias -= monto;
  return monto;
}

function riskFromEff(eff){
  let negativos = 0;
  Object.values(eff||{}).forEach(v=>{ if(v<0) negativos++; });
  return Math.min(58, 16 + negativos*10);
}

const SUFIJOS = {
  bueno: [' · le salió mejor de lo esperado', ' · la jugada le rindió de más', ' · todo cayó de pie', ' · terminó siendo una decisión redonda'],
  neutral: [' · quedó en la nada', ' · no cambió mucho las cosas', ' · pasó sin pena ni gloria', ' · nadie le dio mucha bola'],
  malo: [' · se le complicó más de lo esperado', ' · la jugada le salió carísima', ' · terminó pagando caro esa decisión', ' · se le fue de las manos'],
};

// Toda decisión "común" (sin special) tiene un resultado al azar: bueno, neutro o malo.
// Las elecciones más polémicas (las que ya tienen algún costo propio en su eff) arrastran
// más chances de que salga mal, pero nunca es un resultado garantizado. Cuando sale mal
// y la jugada era realmente riesgosa, puede haber un coletazo extra (trasciende, pega en
// la imagen) para que el "malo" tenga peso real y no sea solo un número más chico.
function applyConsequence(eff){
  if(!eff || Object.keys(eff).length===0) return {kind:'neutral', risk:0};
  const risk = riskFromEff(eff);
  const roll = Math.random()*100;
  let kind, applied = {};

  if(roll < risk){
    kind = 'malo';
    Object.keys(eff).forEach(k=>{
      const v = eff[k];
      applied[k] = v > 0 ? Math.round(v*-0.55) : Math.round(v*1.6);
    });
  } else if(roll < risk + 24){
    kind = 'neutral';
    Object.keys(eff).forEach(k=>{ applied[k] = Math.round(eff[k]*0.35); });
  } else {
    kind = 'bueno';
    Object.keys(eff).forEach(k=>{ applied[k] = Math.round(eff[k]*1.15); });
  }

  applyEffects(applied);

  if(kind==='malo' && risk >= 34 && Math.random() < 0.4){
    const ripple = Math.random() < 0.5 ? 'opinion' : 'prensa';
    state.stats[ripple] = clamp(state.stats[ripple] - Math.round(rand(3,7)));
  }

  return {kind, risk};
}

// El club puede reaccionar de verdad ante una cagada grande: te rescinde el contrato
// (quedás libre, a buscar club o salir a préstamo) o te recorta el sueldo unilateralmente.
function reaccionDelClub(prob){
  if(state.phase !== 'jugador' || !state.contract) return;
  if(Math.random() >= prob) return;
  if(Math.random() < 0.5){
    // Rescisión automática por causas extrafutbolísticas: el jugador queda sin club,
    // hasta que llegue una nueva oferta (necesariamente de un equipo menor).
    state.club = { n:'Sin club', d:'LIBRE', t:5 };
    state.contract = null;
    state.prestamo = null;
    state.flags.recienRescindido = true;
    addLog('el club rescindió su contrato de forma automática por la situación extrafutbolística; quedó libre, sin equipo');
  } else {
    state.contract.salaryPerYear = Math.round(state.contract.salaryPerYear * 0.7);
    addLog('el club le recortó el salario de forma unilateral tras lo sucedido');
  }
}

function rand(min, max){ return min + Math.random()*(max-min); }

function edadCurvaFutbol(age){
  if(age <= 19) return rand(2, 5);
  if(age <= 23) return rand(1.5, 4);
  if(age <= 28) return rand(0.5, 2);
  if(age <= 32) return rand(-0.5, 1);
  if(age <= 36) return rand(-2, 0);
  return rand(-4, -1.5);
}

function simularTemporada(){
  // El nivel evoluciona con la edad y el potencial de la carrera, además de con las decisiones:
  // se crece de joven, se sostiene en el pico y se declina de grande, como una carrera real.
  const curva = edadCurvaFutbol(state.age);
  const ajusteCurva = curva > 0 ? curva * state.potencial.mult : curva;
  state.stats.futbol = clamp(Math.min(state.potencial.cap, state.stats.futbol + ajusteCurva));
  // Un poco de resiliencia natural: si la Cabeza viene golpeada, hay algo de recuperación
  // orgánica temporada a temporada (madurar, aprender de los errores), no todo es cuesta abajo.
  if(state.stats.cabeza < 55){
    state.stats.cabeza = clamp(state.stats.cabeza + rand(0.5, 2));
  }
  // Las decisiones graves (denuncias, escándalos, lesiones) dejan un efecto temporal sobre
  // el nivel real de esa temporada y los minutos que vas a sumar, más allá del stat de Fútbol.
  const fEfectivo = clamp(state.stats.futbol + state.modFutbolTemporal);
  const partidos = Math.max(0, Math.min(38, Math.round(rand(4,9) + (fEfectivo/100)*30 + state.modPartidosTemporal)));
  const factorMin = partidos/38;
  const goles = Math.max(0, Math.round(factorMin * (fEfectivo/100) * rand(6,16)));
  const asistencias = Math.max(0, Math.round(factorMin * (fEfectivo/100) * rand(4,12)));
  state.temporadaStats = {partidos, goles, asistencias};
  // Los modificadores se atenúan con el tiempo: el golpe (o el envión) no dura para siempre.
  state.modFutbolTemporal = Math.round(state.modFutbolTemporal * 0.35);
  state.modPartidosTemporal = Math.round(state.modPartidosTemporal * 0.35);
  state.carreraPJ += partidos;
  state.carreraGoles += goles;
  state.carreraAsistencias += asistencias;
  return state.temporadaStats;
}

function tierParaNivel(futbol){
  if(futbol >= 78) return {min:1, max:3};
  if(futbol >= 62) return {min:2, max:4};
  if(futbol >= 46) return {min:3, max:5};
  if(futbol >= 30) return {min:4, max:5};
  return {min:5, max:5};
}

function nombreLiga(club){
  if(club.d==='PD') return 'Primera División';
  if(club.d==='PN') return 'Primera Nacional';
  if(club.d==='MX') return 'Liga MX';
  if(club.d==='EU') return 'Europa';
  if(club.d==='LIBRE') return 'Sin club';
  return 'Espacio Político';
}

function contractOfferEvent(){
  const clubActual = state.club;
  const futbol = state.stats.futbol;
  const ofertas = [];
  const sinClub = clubActual.d === 'LIBRE';
  if(!sinClub){
    ofertas.push({ club: clubActual, years: Math.round(rand(1,4)), salary: computeSalary(clubActual, futbol, state.age) });
  }

  if(clubActual.d === 'EU'){
    let rango;
    if(futbol >= 82) rango = {min:0, max:0.5};
    else if(futbol >= 68) rango = {min:0, max:1.5};
    else rango = {min:0.5, max:1.5};
    const c1 = randomClub(rango.min, rango.max, ['EU']);
    ofertas.push({ club:c1, years: Math.round(rand(1,4)), salary: computeSalary(c1, futbol, state.age) });
    const c2 = randomClub(0.5, 1.5, ['EU']);
    ofertas.push({ club:c2, years: Math.round(rand(1,3)), salary: computeSalary(c2, futbol, state.age) });
  } else if(clubActual.d === 'MX'){
    const c1 = randomClub(1.8, 1.8, ['MX']);
    ofertas.push({ club:c1, years: Math.round(rand(1,4)), salary: computeSalary(c1, futbol, state.age) });
    if(Math.random() < 0.3){
      const rangoArg = tierParaNivel(futbol);
      const c2 = randomClub(rangoArg.min, rangoArg.max, ['PD','PN']);
      ofertas.push({ club:c2, years: Math.round(rand(1,3)), salary: computeSalary(c2, futbol, state.age) });
    }
  } else {
    let rango = tierParaNivel(futbol);
    if(state.stats.opinion < 35 || state.stats.junta < 30){
      rango = {min: Math.min(5, rango.min+1), max: Math.min(5, rango.max+1)};
    }
    // Recién rescindido por una cagada extrafutbolística: nadie de arriba te va a tocar por ahora.
    if(sinClub && state.flags.recienRescindido){
      rango = {min: Math.min(5, rango.max), max: 5};
    }
    const c1 = randomClub(rango.min, rango.max, ['PD','PN']);
    ofertas.push({ club:c1, years: Math.round(rand(1,4)), salary: computeSalary(c1, futbol, state.age) });
    const c2 = randomClub(rango.min, Math.min(5, rango.max+1), ['PD','PN']);
    ofertas.push({ club:c2, years: Math.round(rand(1,3)), salary: computeSalary(c2, futbol, state.age) });

    // Ofertas del exterior: solo si el nivel futbolístico y la Junta acompañan.
    if(!sinClub && futbol > 68 && state.stats.junta >= 50 && Math.random() < 0.4){
      const rangoEU = futbol >= 82 ? {min:0, max:0.5} : {min:0.5, max:1.5};
      const cEU = randomClub(rangoEU.min, rangoEU.max, ['EU']);
      ofertas.push({ club:cEU, years: Math.round(rand(2,5)), salary: computeSalary(cEU, futbol, state.age) });
    }
  }

  const ofertasUnicas = ofertas.filter((o,i,arr)=> arr.findIndex(x=>x.club.n===o.club.n)===i);
  const intro = sinClub
    ? `Estás sin club. Llegan algunas propuestas, lógicamente más modestas que antes, para volver a tener equipo. También podés decidir que tu camino sea otro.`
    : `Se te vence el contrato con ${clubActual.n}. Llegan propuestas acordes a tu nivel actual para definir dónde jugás las próximas temporadas.`;

  const choices = ofertasUnicas.map(o => ({
    label: `${o.club.n} (${nombreLiga(o.club)}) — ${o.years} año${o.years===1?'':'s'} — ${fmtUSD(o.salary)}/año`,
    eff: {},
    log: `firmó con ${o.club.n} por ${o.years} año${o.years===1?'':'s'}`,
    special: 'firmarContrato',
    offerData: o,
  }));

  // Estando libre, además de firmar en algún lado, se abren otros caminos para la carrera.
  if(sinClub){

  return {

function ejecutarDeportacion(){
  const aMexico = Math.random() < 0.5;
  let nuevoClub;
  if(aMexico){
    nuevoClub = randomClub(1.8, 1.8, ['MX']);
  } else {
    const rango = tierParaNivel(state.stats.futbol);
    nuevoClub = randomClub(Math.min(5, rango.max+1), 5, ['PD','PN']);
  }
  state.club = nuevoClub;
  state.contract = { yearsLeft: Math.round(rand(1,2)), salaryPerYear: computeSalary(nuevoClub, state.stats.futbol, state.age) };
  state.prestamo = null;
  addLog(`fue deportado de Europa por la situación y tuvo que volver a jugar a ${aMexico ? 'México' : 'Argentina'}`);
}

// Cada incidente serio en Europa (aprietes, peleas, denuncias, consumo) suma riesgo real
// de deportación: 20% de base, un poco más si ya venís acumulando quilombos.
function registrarIncidenteEuropa(probBase){
  state.flags.incidentesEuropa = (state.flags.incidentesEuropa||0) + 1;
  const prob = Math.min(0.45, probBase + (state.flags.incidentesEuropa-1)*0.05);
  if(Math.random() < prob){
    ejecutarDeportacion();
  }
}

function simularTemporadaDT(){
  const nivel = clamp(state.stats.cabeza*0.5 + state.stats.junta*0.3 + state.stats.opinion*0.2);
  const pj = Math.round(rand(28,38));
  const winRate = 0.18 + (nivel/100)*0.47;
  const drawRate = 0.22;
  const ganados = Math.max(0, Math.round(pj*winRate));
  const empatados = Math.max(0, Math.round(pj*drawRate));
  const perdidos = Math.max(0, pj - ganados - empatados);
  state.dtTemporada = {pj, ganados, empatados, perdidos};
  state.dtPJ += pj; state.dtGanados += ganados; state.dtEmpatados += empatados; state.dtPerdidos += perdidos;
  if(state.dtContract){ state.carreraGanancias += state.dtContract.salaryPerYear; state.dtContract.yearsLeft -= 1; }
}

function checkFlagFollowups(){
  const seguimientos = [
    {flag:'aceptoBarraAsado', done:'seguidoBarraFavor', chance:0.30, build: barraFavorEvent},
    {flag:'tieneFundacion', done:'seguidoFundacion', chance:0.30, build: fundacionSeguimientoEvent},

    {flag:'reconocioHijo', done:'seguidoHijo', chance:0.22, build: hijoCreceEvent},
    {flag:'representanteTurbioActivo', done:'seguidoRepresentanteTurbio', chance:0.28, build: representanteQuiereMasEvent},
    {flag:'coimeoAlDT', done:'seguidoCoimaDT', chance:0.30, build: investiganCoimaDTEvent},
    {flag:'noAprendioIdiomaEuropa', done:'seguidoMultaIdioma', chance:0.35, build: multaIdiomaEvent},
    {flag:'noAprendioIdiomaEuropa', done:'seguidoDTIdioma', chance:0.30, build: dtSacaMinutosIdiomaEvent},
  ];
  for(const s of seguimientos){
    if(state.flags[s.flag] && !state.flags[s.done] && Math.random() < s.chance){
      state.flags[s.done] = true;
      return s.build();
    }
  }
  return null;
}

function pickEvent(extraExclude){
  let pool;
  if(state.phase==='dt') pool = eventsForDT();
  else if(state.phase==='politico') pool = eventsForPolitico();
  else if(state.age <= 19) pool = eventsFor16to19();
  else if(state.age <= 25) pool = eventsFor20to25();
  else if(state.age <= 32) pool = eventsFor26to32();
  else pool = eventsFor33plus();

  if(state.phase==='jugador' && state.club && state.club.d==='MX'){
    pool = pool.concat(eventsForMexico());
  }
  if(state.phase==='jugador' && state.club && state.club.d==='EU'){
    pool = pool.concat(eventsForEuropa());
  }

  // Sistema de enfriamiento por evento: cada tag tiene su propio cooldown, proporcional
  // al tamaño del pool disponible ese turno. Evita tanto repetir seguido como agotar
  // pools chicos (DT, Europa) de golpe con una ventana fija.
  if(!state.eventCooldowns) state.eventCooldowns = {};
  const enFriamiento = new Set(Object.keys(state.eventCooldowns).filter(k => state.eventCooldowns[k] > 0));
  const excluidosSesion = new Set(extraExclude || []);

  let disponibles = pool.filter(e => !enFriamiento.has(e.tag) && !excluidosSesion.has(e.tag));
  if(disponibles.length === 0) disponibles = pool.filter(e => !excluidosSesion.has(e.tag));
  if(disponibles.length === 0) disponibles = pool;

  const elegido = disponibles[Math.floor(Math.random()*disponibles.length)];
  state.eventCooldowns[elegido.tag] = Math.max(2, Math.floor(pool.length * 0.4));
  return elegido;
}

function decaerCooldowns(){
  if(!state.eventCooldowns) return;
  Object.keys(state.eventCooldowns).forEach(k=>{
    state.eventCooldowns[k] = Math.max(0, state.eventCooldowns[k] - 1);
  });
}

function leakChance(base){
  const factor = 1 + (50 - state.stats.prensa) / 100;
  return Math.max(0.05, Math.min(0.9, base * factor));
}

function darkRiskCheck(){
  const s = state.stats;
  const riesgo = (100 - s.cabeza) * 0.20 + (100 - s.junta) * 0.22 + (100 - s.opinion) * 0.22 + (100 - s.barrio) * 0.14 + (100 - s.prensa) * 0.14;
  if(riesgo < 64) return null;
  const roll = Math.random() * 100;
  if(roll > riesgo * 0.42) return null;

  const opciones = [];
  if(s.cabeza < 28) opciones.push('consumido');
  if(s.junta < 25) opciones.push('quemado');
  if(s.opinion < 32 && s.fama > 36) opciones.push('caido');
  if(opciones.length===0) return null;
  return opciones[Math.floor(Math.random()*opciones.length)];
}

function buildSeasonQueue(){
  decaerCooldowns();
  const q = [];
  if(state.flags.pendingDoping){ state.flags.pendingDoping=false; q.push(dopingSuspensionEvent()); }
  if(state.flags.pendingOfertaFuerte){ state.flags.pendingOfertaFuerte=false; q.push(ofertaPoliticaFuerte()); }
  if(state.flags.pendingFiltracionBarra){ state.flags.pendingFiltracionBarra=false; q.push(filtracionBarraEvent()); }
  if(state.flags.pendingAmenazaBarra){ state.flags.pendingAmenazaBarra=false; q.push(amenazaBarraEvent()); }
  if(state.flags.pendingInfidelidadDescubierta){ state.flags.pendingInfidelidadDescubierta=false; q.push(infidelidadDescubiertaEvent()); }
  if(state.flags.pendingCoimaDescubierta){ state.flags.pendingCoimaDescubierta=false; q.push(coimaDescubiertaEvent()); }
  if(state.flags.pendingResultadoJusticia){ state.flags.pendingResultadoJusticia=false; q.push(resultadoJusticiaEvent()); }
  if(state.phase==='jugador' && (!state.contract || state.contract.yearsLeft <= 0)){ q.push(contractOfferEvent()); }
  if(state.phase==='jugador' && state.club.d!=='LIBRE' && !state.prestamo && state.temporadaStats && state.temporadaStats.partidos < 10 && state.age <= 24 && !state.flags.prestamoOfrecido && Math.random() < 0.6){
    state.flags.prestamoOfrecido = true;
    q.push(prestamoEvent());
  }
  if(state.phase==='jugador' && (state.club.d==='PD' || state.club.d==='PN') && state.age >= 27 && state.age <= 30 && Math.random() < 0.18){
    q.push(ofertaMexicoEvent());
  }
  if(state.phase==='jugador' && state.age >= 34 && state.age <= 40 && !state.flags.definioFuturo){
    q.push(definirFuturoEvent());
  }
  if(state.phase==='dt' && (!state.dtContract || state.dtContract.yearsLeft <= 0)){
    q.push(dtClubOfferEvent());
  } else if(state.phase==='dt' && state.dtContract && state.dtPJ===0 && !state.flags.debutoDT){
    state.flags.debutoDT = true;
    q.push(debutComoDTEvent());
  }
  const seguimiento = checkFlagFollowups();
  if(seguimiento) q.push(seguimiento);

  // Estructura de temporada: 2 decisiones importantes (además de lo pendiente arriba,
  // que ya incluye el mercado de pases si corresponde), o 1 sola si es DT/Político.
  const decisionesFijas = (state.phase==='dt' || state.phase==='politico') ? 1 : 2;
  const usadosEstaTemporada = [];
  for(let i=0; i<decisionesFijas; i++){
    const ev = pickEvent(usadosEstaTemporada);
    usadosEstaTemporada.push(ev.tag);
    q.push(ev);
  }
  return q;
}

function showNextEventInQueue(){
  if(!state.seasonQueue || state.seasonQueue.length === 0){
    finalizeSeasonHighlight();
    state.age += 1;
    setTimeout(nextTurn, 150);
    return;
  }
  const ev = state.seasonQueue.shift();
  const num = state.seasonTotal - state.seasonQueue.length;
  $('seasonProgress').textContent = `Decisión ${num} de ${state.seasonTotal} esta temporada`;
  renderEvent(ev);
}

function finalizeSeasonHighlight(){
  if(!state.currentSeasonEvents || !state.currentSeasonEvents.length){
    return;
  }
  const last = state.historyBlocks[state.historyBlocks.length-1];
  if(!last || last.age !== state.age) return;
  // Balance de la temporada: todo lo que pasó ese año, no solo un evento suelto.
  last.balance = state.currentSeasonEvents.map(e => e.text);
  const destacado = state.currentSeasonEvents.find(e=>e.danger) || state.currentSeasonEvents[state.currentSeasonEvents.length-1];
  last.highlight = destacado.text;
}

function nextTurn(){
  if(state.prestamo){
    state.prestamo.yearsLeft -= 1;
    if(state.prestamo.yearsLeft <= 0){
      addLog(`volvió de su préstamo en ${state.prestamo.club.n} a ${state.club.n}`);
      state.prestamo = null;
    }
  }

  if(state.phase==='suspendido'){
    state.suspensionYearsLeft -= 1;
    if(state.suspensionYearsLeft <= 0){
      state.phase = state.flags.dtInterino ? 'dt' : 'jugador';
      addLog(state.flags.dtInterino ? 'terminó la suspensión y sigue como DT' : 'terminó la suspensión y vuelve a jugar');
    }
  }

  const dark = darkRiskCheck();
  if(dark){ finishGame(dark); return; }

  if(state.phase==='jugador' && state.age >= 41){ finishGame('auto'); return; }
  if(state.phase==='politico' && state.age >= 50){ finishGame('politico'); return; }
  if(state.phase==='dt' && state.age >= 50){ finishGame('dt'); return; }

  if(state.phase==='jugador'){
    if(state.club.d === 'LIBRE'){
      // Sin club no hay partidos oficiales que jugar esa temporada.
      state.temporadaStats = {partidos:0, goles:0, asistencias:0};
    } else {
      simularTemporada();
      if(state.contract){
        state.carreraGanancias += state.contract.salaryPerYear;
        state.contract.yearsLeft -= 1;
      }
    }
  } else if(state.phase==='dt'){
    state.temporadaStats = null;
    if(state.dtContract){
      simularTemporadaDT();
    } else {
      state.dtTemporada = null;
    }
  } else {
    state.temporadaStats = null;
  }

  const entidadActual = state.prestamo ? state.prestamo.club : state.club;
  if(entidadActual && (!state.historyBlocks.length || state.historyBlocks[state.historyBlocks.length-1].age !== state.age)){
    state.historyBlocks.push({age: state.age, name: entidadActual.n, highlight:''});
  }
  state.currentSeasonEvents = [];

  state.seasonQueue = buildSeasonQueue();
  state.seasonTotal = state.seasonQueue.length;

  renderStats();
  showNextEventInQueue();
}

function renderEvent(ev){
  state.currentEventMeta = {tag: ev.tag, danger: !!ev.danger, clubReact: !!ev.clubReact};
  $('eventTag').textContent = ev.tag;
  $('eventTag').className = 'event-tag' + (ev.danger ? ' danger' : '');
  $('eventText').textContent = ev.text;
  const box = $('choices');
  box.innerHTML='';
  ev.choices.forEach(c=>{
    const b = document.createElement('button');
    b.className='choice-btn';
    b.textContent = c.label;
    b.onclick = ()=> resolveChoice(c);
    box.appendChild(b);
  });
}

function resolveChoice(c){
  if(c.special==='retirarseLibre'){
    addLog(c.log);
    finishGame('auto');
    return;
  }
  let sufijo = '';
  if(c.special){
    applyEffects(c.eff);
  } else {
    const result = applyConsequence(c.eff);
    const opciones = SUFIJOS[result.kind] || [''];
    sufijo = opciones[Math.floor(Math.random()*opciones.length)];
    if(result.kind==='malo' && result.risk >= 34){
      reaccionDelClub(0.16);
    }
  }
  if(state.currentEventMeta && state.currentEventMeta.clubReact){
    reaccionDelClub(0.22);
  }
  if(c.setFlag){ state.flags[c.setFlag] = true; }
  addLog(c.log + sufijo);
  if(state.currentSeasonEvents){
    state.currentSeasonEvents.push({
      tag: state.currentEventMeta ? state.currentEventMeta.tag : '',
      danger: state.currentEventMeta ? state.currentEventMeta.danger : false,
      text: c.log + sufijo,
    });
  }
  // Cualquier situación grave (denuncias, escándalos, amenazas) pega en el nivel real
  // y los minutos de la temporada, más allá de las stats — no es solo un número más.
  if(state.currentEventMeta && state.currentEventMeta.danger){
    state.modFutbolTemporal -= rand(2, 6);
    state.modPartidosTemporal -= rand(2, 5);
  }

  if(c.special==='chanceDoping' && Math.random() < leakChance(0.4)){
    state.flags.pendingDoping = true;
  }
  if(c.special==='chanceFiltracionBarra' && Math.random() < leakChance(0.35)){
    state.flags.pendingFiltracionBarra = true;
  }
  if(c.special==='chanceAmenazaBarra' && Math.random() < 0.3){
    state.flags.pendingAmenazaBarra = true;
  }
  if(c.special==='chanceDescubrenInfidelidad' && Math.random() < leakChance(0.35)){
    state.flags.pendingInfidelidadDescubierta = true;
  }
  if(c.special==='chanceCoimaDenuncia'){
    const monto = pagarPorcentajeGanancias(0.30);
    addLog(`pagó ${fmtUSD(monto)} de coima para bajar la denuncia (30% de sus ganancias)`);
    if(Math.random() < leakChance(0.4)){
      state.flags.pendingCoimaDescubierta = true;
    }
  }
  if(c.special==='prestamoAlPadre'){
    const monto = pagarPorcentajeGanancias(0.25);
    addLog(`le prestó ${fmtUSD(monto)} a su viejo (25% de sus ganancias)`);
  }
  if(c.special==='deudaJuegoTotal'){
    const monto = pagarPorcentajeGanancias(0.55);
    addLog(`pagó ${fmtUSD(monto)} de deuda de juego de una sola vez (55% de sus ganancias)`);
  }
  if(c.special==='deudaJuegoParcial'){
    const monto = pagarPorcentajeGanancias(0.28);
    addLog(`pagó ${fmtUSD(monto)} como primera cuota de una deuda de juego (28% de sus ganancias)`);
  }
  if(c.special==='prestarACompanero'){
    const monto = pagarPorcentajeGanancias(0.10);
    addLog(`le prestó ${fmtUSD(monto)} a un compañero de inferiores en aprietos (10% de sus ganancias)`);
  }
  if(c.special==='resolverDenunciaJusticia'){
    state.flags.pendingResultadoJusticia = true;
  }
  if(c.special==='aceptaDTinterino'){
    state.phase='suspendido'; state.suspensionYearsLeft=2; state.flags.dtInterino=true;
  }
  if(c.special==='esperaSuspension'){
    state.phase='suspendido'; state.suspensionYearsLeft=2; state.flags.dtInterino=false;
  }
  if(c.special==='abreDT'){ state.flags.puedeDT = true; }
  if(c.special==='entraPolitica'){
    state.phase='politico';
    const partido = PARTIDOS_POLITICOS[Math.floor(Math.random()*PARTIDOS_POLITICOS.length)];
    state.club = {n: partido, d:'POL', t:0};
    state.contract = null;
  }
  if(c.special==='firmarContrato'){
    state.club = c.offerData.club;
    state.contract = {yearsLeft: c.offerData.years, salaryPerYear: c.offerData.salary};
    state.prestamo = null;
    state.flags.prestamoOfrecido = false;
    state.flags.recienRescindido = false;
  }
  if(c.special==='aceptaPrestamo'){
    state.prestamo = {club: c.clubDestino, yearsLeft: 1};
  }
  if(c.special==='representanteTurbioFirmar'){
    if(Math.random() < 0.5){
      applyEffects({guita:22, fama:4});
      addLog('la apuesta con el representante turbio le salió redonda: se hizo millonario');
    } else {
      applyEffects({cabeza:-10, futbol:-6, guita:-6});
      addLog('la noche con la modelo le salió carísima: terminó con un problema de salud complicado');
    }
  }
  if(c.special==='periodistaAceptar'){
    if(Math.random() < 0.6){
      applyEffects({futbol:2, fama:4});
      addLog('ganó terreno en el equipo tras la nota con la periodista');
    } else {
      applyEffects({futbol:-3, junta:-8, opinion:-4});
      addLog('se filtró todo y el vestuario lo dejó de lado tras la nota con la periodista');
    }
  }
  if(c.special==='manejarBorracho'){
    if(Math.random() < 0.8){
      applyEffects({cabeza:-8, opinion:-6, prensa:-6, guita:-4});
      addLog('chocó contra un surtidor manejando alcoholizado y dio positivo en el test');
      reaccionDelClub(0.3);
    } else {
      addLog('manejó alcoholizado volviendo de la vuelta olímpica y esta vez no pasó nada');
    }
  }
  if(c.special==='peleaCano'){
    if(Math.random() < 0.5){
      applyEffects({junta:-10, opinion:-4, cabeza:-4});
      addLog('la pelea se le fue de las manos y terminó lesionando gravemente a un compañero, arruinándole la carrera');
      reaccionDelClub(0.35);
    } else {
      applyEffects({futbol:-5, cabeza:-8, opinion:-3});
      addLog('la pelea se le fue en contra: terminó cagado a bifes por el propio compañero');
    }
  }
  if(c.special==='copaPotreroExCrack'){
    if(Math.random() < 0.5){
      applyEffects({futbol:-12, cabeza:-4});
      addLog('sufrió una lesión grave jugando la Copa Potrero');
    } else {
      addLog('zafó de la lesión jugando la Copa Potrero, aunque el nivel se resintió un poco');
    }
  }
  if(c.special==='copaPotreroPolemico'){
    if(Math.random() < 0.5){
      state.flags.pendingResultadoJusticia = true;
      addLog('después de la Copa Potrero, una denuncia por violencia de género lo golpeó de lleno');
    } else {
      addLog('la Copa Potrero con el streamer polémico pasó sin sobresaltos');
    }
  }
  if(c.special==='copaPotreroNoJugar'){
    if(Math.random() < 0.4){
      applyEffects({fama:6, opinion:3});
      addLog('quedó bien parado ante ojeadores del exterior por no arriesgarse en la Copa Potrero');
    } else {
      addLog('no jugar la Copa Potrero no cambió mucho el panorama');
    }
  }
  if(c.special==='ojeadorTruchoAceptar'){
    if(Math.random() < 0.7){
      applyEffects({futbol:6, fama:4});
      addLog('el arreglo con el ojeador le salió bien y subió de categoría rápido');
    } else {
      applyEffects({futbol:-4, opinion:-6, junta:-6});
      addLog('lo descubrieron con la partida de nacimiento arreglada y quedó suspendido un torneo entero');
    }
  }
  if(c.special==='pastillaMilagrosa'){
    if(Math.random() < 0.5){
      applyEffects({futbol:5, fama:2});
      addLog('la pastilla misteriosa le hizo rendir como nunca en la final');
    } else {
      applyEffects({cabeza:-8, futbol:-4});
      addLog('se descompensó en pleno partido después de tomar una pastilla misteriosa');
    }
  }
  if(c.special==='examenAjeno'){
    if(Math.random() < 0.4){
      applyEffects({junta:6});
      addLog('dio el control antidoping por su compañero y nadie se enteró');
    } else {
      applyEffects({futbol:-6, opinion:-8, junta:-4});
      addLog('lo descubrieron dando un control antidoping por otro y quedó suspendido');
      reaccionDelClub(0.4);
    }
  }
  if(c.special==='noPagarFotos'){
    if(Math.random() < 0.5){
      addLog('el excompañero se achicó y no filtró las fotos comprometedoras');
    } else {
      applyEffects({opinion:-8, prensa:-5});
      state.modFutbolTemporal -= 4;
      state.modPartidosTemporal -= 6;
      reaccionDelClub(0.18);
      addLog('las fotos comprometedoras se filtraron igual, pese a no haber pagado, y el club le bajó los minutos');
    }
  }
  if(c.special==='chequeSinFondos'){
    if(Math.random() < 0.5){
      applyEffects({guita:14});
      addLog('el empresario amigo terminó pagando todo con intereses');
    } else {
      applyEffects({guita:-10, junta:-4});
      addLog('el reclamo por el cheque sin fondos terminó saliendo peor de lo esperado');
    }
  }
  if(c.special==='colaborarNarcoMexico'){
    applyEffects({guita:10, cabeza:-6});
    if(Math.random() < 0.45){
      addLog('por ahora la protección funcionó, pero quedó metido en un compromiso peligroso del que no va a poder salir fácil');
    } else {
      applyEffects({futbol:-14, opinion:-14, junta:-16, barrio:-10});
      const clubDestino = randomClub(4, 5, ['PD','PN']);
      state.club = clubDestino;
      state.contract = {yearsLeft: Math.round(rand(1,2)), salaryPerYear: computeSalary(clubDestino, state.stats.futbol, state.age)};
      state.prestamo = null;
      addLog('quedó vinculado en una causa judicial en México y tuvo que volver de urgencia a jugar a Argentina');
      reaccionDelClub(0.6);
    }
  }
  if(c.special==='aprieteEuropa'){
    applyEffects({guita:10, junta:-10, opinion:-4});
    registrarIncidenteEuropa(0.20);
  }
  if(c.special==='peleaEuropa'){
    applyEffects({cabeza:-8, opinion:-6});
    registrarIncidenteEuropa(0.20);
  }
  if(c.special==='denunciaEuropa'){
    applyEffects({opinion:-8, prensa:-5});
    registrarIncidenteEuropa(0.20);
  }
  if(c.special==='rumorConsumoEuropa'){
    applyEffects({opinion:-6, cabeza:-3});
    registrarIncidenteEuropa(0.20);
  }
  if(c.special==='cafeEmpresarioMediatico'){
    applyEffects({candidateable:14, prensa:6, junta:-5});
  }
  if(c.special==='posturaPoliticaClara'){
    applyEffects({candidateable:6, opinion:-4, fama:3});
  }
  if(c.special==='clausulaRaraAceptar'){
    const nuevoClub = randomClub(1, 5, ['PD','PN']);
    const duracionRara = Math.random() < 0.5 ? 1 : Math.round(rand(6,8));
    const salarioNormal = computeSalary(nuevoClub, state.stats.futbol, state.age);
    const distorsion = Math.random() < 0.5 ? rand(0.2,0.5) : rand(1.8,3);
    const salarioDudoso = Math.round(salarioNormal * distorsion / 500) * 500;
    state.club = nuevoClub;
    state.contract = {yearsLeft: duracionRara, salaryPerYear: salarioDudoso};
    state.prestamo = null;
    addLog(`la cláusula rarísima lo transfirió de urgencia a ${nuevoClub.n}, con un contrato de ${duracionRara} año${duracionRara===1?'':'s'} y un sueldo bastante dudoso`);
  }
  if(c.special==='pedirVueltaArgentina'){
    state.club = { n:'Sin club', d:'LIBRE', t:5 };
    state.contract = null;
    state.prestamo = null;
    addLog('rescindió su contrato en México y quedó a la espera de ofertas de Argentina');
  }
  if(c.special==='plantarseCuerpoTecnico'){
    if(Math.random() < 0.5){
      state.modFutbolTemporal -= 5;
      state.modPartidosTemporal -= 22;
      addLog('el plante le salió caro: quedó relegado y apenas sumó minutos esa temporada');
    }
  }
  if(c.special==='lesionGrave'){
    state.modFutbolTemporal -= 10;
    state.modPartidosTemporal -= 27;
  }
  if(c.special==='firmarContratoDT'){
    state.club = c.offerData.club;
    state.dtContract = {yearsLeft: c.offerData.years, salaryPerYear: c.offerData.salary};
  }
  if(c.special==='responderFuerteDirigencia'){
    if(Math.random() < 0.5){
      state.club = { n:'Sin club', d:'LIBRE', t:5 };
      state.dtContract = null;
      addLog('la dirigencia lo echó de inmediato tras la conferencia de prensa');
    }
  }
  if(c.special==='seguirJugador'){
    state.flags.definioFuturo = true;
  }
  if(c.special==='transicionDT'){
    state.phase = 'dt';
    state.contract = null;
    state.flags.definioFuturo = true;
    addLog('colgó los botines y se convirtió en director técnico');
  }
  if(c.special==='transicionPolitica'){
    state.phase = 'politico';
    const partido = PARTIDOS_POLITICOS[Math.floor(Math.random()*PARTIDOS_POLITICOS.length)];
    state.club = {n: partido, d:'POL', t:0};
    state.contract = null;
    state.flags.definioFuturo = true;
    addLog(`dejó el fútbol para meterse de lleno en política con ${partido}`);
  }

  if(state.stats.candidateable >= 55 && !state.flags.ofertaPolitica && state.phase==='jugador'){
    state.flags.ofertaPolitica = true;
    state.flags.pendingOfertaFuerte = true;
  }

  renderStats();
  setTimeout(showNextEventInQueue, 150);
}

function finishGame(reason){
  $('game').style.display='none';
  $('end').style.display='block';
  const s = state.stats;
  let title, flavor, danger=false;

  if(reason==='consumido'){ title='CONSUMIDO'; danger=true;
    flavor = `Los consumos problemáticos te fueron ganando terreno hasta que ya no hubo club que te bancara. La carrera se corta acá, a los ${state.age} años.`; }
  else if(reason==='quemado'){ title='QUEMADO'; danger=true;
    flavor = `Un quilombo con la ley te saca de circulación. Ningún club se quiere hacer cargo del quilombo que dejaste. Se acabó a los ${state.age} años.`; }
  else if(reason==='caido'){ title='ÍDOLO CAÍDO'; danger=true;
    flavor = `Una denuncia grave por violencia de género te saca del fútbol de forma definitiva. El barrio que te bancó, ahora te da la espalda. Fin de la carrera a los ${state.age} años.`; }
  else if(reason==='politico'){ title='CANDIDATO'; 
    flavor = `Dejaste los botines por la boleta. A los ${state.age} años sos una figura política hecha y derecha, con el barrio como base electoral.`; }
  else if(reason==='dt'){ title='DIRECTOR TÉCNICO';
    flavor = `Colgaste los botines para siempre y te quedaste del lado de la línea de cal. A los ${state.age} años, tu carrera como entrenador recién empieza.`; }
  else {
    if(s.futbol >= 82 && s.barrio >= 68 && s.fama >= 70 && s.opinion >= 55){ title='LEYENDA';
      flavor = `Te retirás a los ${state.age} años dejando una marca que va a durar generaciones. No hay grieta que discuta tu nombre: sos de otro planeta.`; }
    else if(s.futbol >= 62 && s.barrio >= 52 && s.fama >= 50){ title='ÍDOLO';
      flavor = `Te retirás a los ${state.age} años como uno de los pocos que el barrio nunca va a discutir. Va a haber estatua.`; }
    else if(s.futbol < 45){ title='WASHED';
      flavor = `La carrera se apagó de a poco, sin escándalo ni gloria. A los ${state.age} años, nadie te llama para el próximo semestre.`; }
    else { title='RETIRADO';
      flavor = `Cerraste una carrera correcta, sin sobresaltos. A los ${state.age} años, el barrio te recuerda, pero sin estatua.`; }
  }

  $('stamp').textContent = title;
  $('stamp').className = 'stamp' + (danger ? ' danger' : '') + (title==='LEYENDA' ? ' leyenda' : '');
  $('endFlavor').textContent = flavor;
  $('finalStats').innerHTML = [
    ['FÚTBOL', s.futbol], ['FAMA', s.fama], ['GUITA', s.guita],
    ['CABEZA', s.cabeza], ['BARRIO', s.barrio], ['JUNTA', s.junta>=50?'BUENA':'MALA'], ['OPINIÓN', s.opinion], ['PRENSA', s.prensa], ['ROSCA', s.candidateable],
  ].map(([l,n])=>`<div class="fstat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  const mediaJugador = Math.round(
    (s.futbol + s.fama + s.cabeza + s.barrio + s.junta + s.opinion + s.prensa + s.candidateable) / 8
  );
  $('endCareerNums').innerHTML = [
    ['Media del jugador', `${mediaJugador}/100`],
    ['👟 Partidos jugados', state.carreraPJ],
    ['⚽ Goles', state.carreraGoles],
    ['🤝 Asistencias', state.carreraAsistencias],
    ['💰 Ganancias totales', fmtUSD(state.carreraGanancias)],
  ].map(([l,v])=>`<div class="row"><span>${l}</span><b>${v}</b></div>`).join('');

  const clubesUnicos = [];
  state.historyBlocks.forEach(b=>{
    if(!clubesUnicos.length || clubesUnicos[clubesUnicos.length-1] !== b.name) clubesUnicos.push(b.name);
  });
  $('endClubs').innerHTML = clubesUnicos.map(n => `
    <span class="club-chip">${crestHTML(n)}<span>${n}</span></span>
  `).join('');

  $('endBreakdown').innerHTML = state.historyBlocks.map(b => {
    const items = (b.balance && b.balance.length) ? b.balance : (b.highlight ? [b.highlight] : ['Sin novedades destacadas']);
    return `
    <div class="eb-card">
      <div class="eb-age">${b.age}</div>
      <div class="eb-body">
        <div class="eb-club">${crestHTML(b.name, 'width:16px;height:16px;font-size:7px;')}<span>${b.name}</span></div>
        <ul class="eb-balance">${items.map(t=>`<li>${t}</li>`).join('')}</ul>
      </div>
    </div>
  `;
  }).join('');
}
</script>
</body>
</html>
